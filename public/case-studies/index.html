<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KeyMouseIT — Operational Systems That Actually Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
    :root {
    --blue:      #2563FF;
    --blue-600:  #1D4ED8;
    --blue-50:   #EFF4FF;
    --blue-100:  #DCE6FF;

    --bg:        #FAFAFA;
    --bg-2:      #F4F6FA;
    --panel:     #FFFFFF;
    --panel-2:   #F4F6FA;
    --card:      #FFFFFF;

    --line:      #EAECF0;
    --line-2:    #F0F2F5;
    --line-3:    #D7DCE3;

    --text:      #111827;
    --text-2:    #475467;
    --muted:     #6B7280;
    --muted-2:   #98A2B3;

    --accent:    #2563FF;
    --accent-2:  #1D4ED8;
    --accent-dim:rgba(37,99,255,0.12);

    --warn:      #FF8E5C;
    --danger:    #FF6B6B;
    --serif:     "Instrument Serif", "Times New Roman", serif;
    --sans:      "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono:      "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    --rad:       12px;
    --rad-lg:    16px;
    --maxw:      1280px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  ::selection { background: var(--accent); color: #000; }

  /* ---------- Page wrappers ---------- */
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }
  .section { position: relative; padding: 120px 0; border-top: 1px solid var(--line); }
  .section:first-of-type { border-top: 0; }

  /* Mono eyebrow */
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .eyebrow .num  { color: var(--text-2); }
  .eyebrow .bar  { display: inline-block; width: 18px; height: 1px; background: var(--line-3); }

  /* Display type */
  .display { font-family: var(--sans); font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.02;
    font-size: clamp(40px, 5.4vw, 76px);
    color: var(--text);
  }
  .display em { font-style: italic; font-weight: 700; letter-spacing: -0.01em; color: var(--accent); }
  .h2 { font-family: var(--sans); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05;
    font-size: clamp(32px, 3.6vw, 52px); color: var(--text);
  }
  .h2 em { font-style: italic; font-weight: 700; color: var(--accent); }
  .lead { font-size: 18px; line-height: 1.55; color: var(--text-2); max-width: 60ch; }
  .small { font-size: 13.5px; color: var(--muted); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; letter-spacing: -0.005em;
    border: 1px solid transparent; transition: all .18s ease;
    white-space: nowrap;
  }
  .btn .arrow { transition: transform .18s ease; }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn-primary { background: var(--accent); color: #ffffff; box-shadow: 0 4px 14px rgba(37,99,255,0.25); }
  .btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(37,99,255,0.35); }
  .btn-ghost { color: var(--text); background: transparent; border-color: var(--line-3); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: rgba(37,99,255,0.04); }

  /* ---------- Background grid + glow ---------- */
  .bg-grid {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(to right, rgba(17,24,39,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(17,24,39,0.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 90%);
  }
  .glow-spot {
    position: absolute; pointer-events: none; z-index: 0;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle at center, rgba(37,99,255,0.08), rgba(37,99,255,0.01) 40%, transparent 70%);
    filter: blur(20px);
  }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
    background: rgba(250,250,250,0.8);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; }
    .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--blue);
    position: relative; overflow: hidden;
  }
  .brand-mark::after {
    content:""; position:absolute; inset:5px; border-radius:3px;
    background:
      radial-gradient(circle at 30% 30%, #fff 0 2px, transparent 2.5px),
      radial-gradient(circle at 70% 70%, #fff 0 2px, transparent 2.5px),
      linear-gradient(45deg, transparent 49%, rgba(255,255,255,0.6) 49% 51%, transparent 51%);
  }
  .nav-links { display: flex; gap: 30px; }
  .nav-links a { font-size: 14px; color: var(--text-2); transition: color .15s; }
  .nav-links a:hover { color: var(--text); }
  .nav-cta { display: flex; align-items: center; gap: 12px; }

  /* ---------- Hero ---------- */
  .hero { padding: 80px 0 120px; position: relative; overflow: hidden; }
  .hero .bg-grid { z-index: 0; }
  .hero .glow-spot { left: -200px; top: -200px; opacity: 0.8; }
  .hero-grid {
    display: grid; grid-template-columns: 1.05fr 1fr; gap: 80px; align-items: center;
    position: relative; z-index: 1;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 12px 6px 8px; border-radius: 999px;
    border: 1px solid var(--line-2); background: rgba(255,255,255,0.02);
    font-size: 12px; color: var(--text-2);
    margin-bottom: 28px;
  }
  .hero-tag .pill {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
    background: var(--accent-dim); color: var(--accent); padding: 3px 8px; border-radius: 999px;
  }
  .hero h1 { margin: 0 0 22px; }
  .hero p.lead { margin: 0 0 36px; }
  .hero-cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .hero-meta {
    display: flex; gap: 28px; margin-top: 52px; padding-top: 28px;
    border-top: 1px solid var(--line);
  }
  .hero-meta .item { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .hero-meta .item b { display: block; font-family: var(--sans); font-size: 18px; font-weight: 500; color: var(--text); margin-top: 6px; letter-spacing: -0.01em; text-transform: none; }

  /* Footer */
  footer.foot {
    padding: 56px 0 40px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  footer.foot .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  footer.foot a:hover { color: var(--text); }

  /* generic anim */
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(1.15); }
  }
  @keyframes flow {
    0%   { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -24; }
  }
  @keyframes sweep {
    0%   { transform: translateY(-100%); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(100%); opacity: 0; }
  }
  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }

  /* Hide bg grids when tweak disables them */
  html.no-grid .bg-grid,
  html.no-grid [aria-hidden="true"][style*="background-size: 48px 48px"],
  html.no-grid [aria-hidden="true"][style*="background-size: 56px 56px"],
  html.no-grid [aria-hidden="true"][style*="background-size: 64px 64px"] {
    display: none !important;
  }

  /* LinkedIn continuity banner */
    .linkedin-banner {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px 10px 12px; margin-bottom: 22px;
    width: fit-content; max-width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(10,102,194,0.08), rgba(10,102,194,0.01));
    border: 1px solid rgba(10,102,194,0.15);
    font-size: 13px; color: var(--text);
    transition: all .18s ease;
  }
  .linkedin-banner:hover { border-color: rgba(10,102,194,0.3); background: linear-gradient(90deg, rgba(10,102,194,0.12), rgba(10,102,194,0.02)); }
  .linkedin-banner .li-icon {
    width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0;
    background: #0A66C2; color: #fff;
    display: inline-grid; place-items: center;
  }
  .linkedin-banner b { font-weight: 600; }
  .linkedin-banner .li-text { color: var(--text-2); }
  .linkedin-banner .li-text b { color: var(--text); margin-right: 6px; }
  .linkedin-banner .li-arrow { color: var(--accent); font-weight: 500; }

  /* Above-the-fold proof strip */
  .hero-proof {
    display: grid; grid-template-columns: repeat(4, 1fr);
    margin-top: 56px; padding-top: 28px;
    border-top: 1px solid var(--line);
    gap: 0;
  }
  .hero-proof-item {
    padding-right: 18px;
    border-right: 1px solid var(--line);
  }
  .hero-proof-item:last-child { border-right: 0; padding-right: 0; padding-left: 18px; }
  .hero-proof-item + .hero-proof-item { padding-left: 18px; }
  .hero-proof-item b {
    display: block; font-family: var(--sans); font-weight: 500;
    font-size: 26px; letter-spacing: -0.022em; color: var(--text); line-height: 1;
  }
  .hero-proof-item span {
    display: block; margin-top: 8px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase;
  }
  .hero-proof-meta b { color: var(--accent); display: inline-flex; align-items: center; gap: 8px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse-dot 2s ease-in-out infinite; display: inline-block; }

    /* Sticky mobile CTA bar */
  .mobile-cta {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(250,250,250,0.95);
    backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-top: 1px solid var(--line-2);
    display: none;
  }
  .mobile-cta .row { display: flex; gap: 8px; align-items: center; }
  .mobile-cta .slot {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .mobile-cta .slot .live-dot { width: 5px; height: 5px; }
  .mobile-cta .btn-primary { flex: 1; justify-content: center; padding: 13px 16px; font-size: 14px; color: #fff; }
  .mobile-cta .btn-ghost   { padding: 13px 14px; font-size: 13px; }

  /* Responsive (basic) */
  @media (max-width: 980px) {
    .hero-grid { grid-template-columns: 1fr; gap: 56px; }
    .nav-links { display: none; }
    .section { padding: 80px 0; }
    .hero-proof { grid-template-columns: repeat(2, 1fr); row-gap: 22px; }
    .hero-proof-item:nth-child(2) { border-right: 0; }
    .hero-proof-item:nth-child(3) { padding-left: 0; }
    .mobile-cta { display: block; }
    body { padding-bottom: 80px; }
    /* Hide desktop nav CTAs since mobile bar handles it */
    .nav .nav-cta .btn-ghost { display: none; }
  }
</style>
</head>
