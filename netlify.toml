[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# VITE_* values are public client-side IDs — safe to appear in build output
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_GA_MEASUREMENT_ID,VITE_CLARITY_PROJECT_ID,VITE_RECAPTCHA_SITE_KEY"

# SPA fallback — serve index.html for all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
