<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solutions We Build — Variants</title>
<link rel="stylesheet" href="assets/colors_and_type.css" />
<link rel="stylesheet" href="assets/solutions.css" />
<style> html, body { margin: 0; background: #0e0f12; } </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="solutions-data.jsx"></script>
<script type="text/babel" src="solutions-common.jsx"></script>
<script type="text/babel" src="solutions-radial.jsx"></script>
<script type="text/babel" src="solutions-rail.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Note() {
  return (
    <div style={{ background: "#12161F", color: "#C3C8D4", height: "100%", padding: "32px 34px", fontFamily: "var(--font-sans)", fontSize: 14.5, lineHeight: 1.6, borderTop: "3px solid #2563EB" }}>
      <div style={{ fontWeight: 800, fontSize: 18, color: "#F4F5F7", marginBottom: 14, letterSpacing: -0.2 }}>Solutions We Build · variants</div>
      <div style={{ color: "#8A92A6", marginBottom: 16 }}>One faithful rebuild + two redesign directions. All five industries, all clickable — tabs/rail switch the modules → hub → outcomes with animated transitions, and each auto-advances.</div>
      <ul style={{ margin: 0, paddingLeft: 18 }}>
        <li style={{ marginBottom: 9 }}><b style={{ color: "#F4F5F7" }}>A · Faithful</b> — your live light theme, rebuilt true-to-source.</li>
        <li style={{ marginBottom: 9 }}><b style={{ color: "#F4F5F7" }}>B · _DearDev dark</b> — same radial interaction in the dark brand system (ties to the hero).</li>
        <li style={{ marginBottom: 0 }}><b style={{ color: "#F4F5F7" }}>C · Rail + core</b> — a different layout: vertical industry rail and two ledgers feeding a central core.</li>
      </ul>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="intro" title="Solutions We Build" subtitle="Interactive industry switcher — faithful + redesign variants">
        <DCArtboard id="note" label="Read me" width={540} height={360}><Note /></DCArtboard>
      </DCSection>

      <DCSection id="faithful" title="A · Faithful rebuild" subtitle="Light theme, true to your live site. Click the tabs.">
        <DCArtboard id="light" label="Faithful · light" width={1420} height={1090}>
          <window.PanelRadial theme="light" initial={0} autoAdvance={true} />
        </DCArtboard>
      </DCSection>

      <DCSection id="redesign" title="Redesign directions" subtitle="Same content + interaction, explored two ways.">
        <DCArtboard id="dark" label="B · _DearDev dark" width={1420} height={1090}>
          <window.PanelRadial theme="dark" initial={3} autoAdvance={true} />
        </DCArtboard>
        <DCArtboard id="rail" label="C · Rail + core (alt layout)" width={1420} height={900}>
          <window.PanelRail theme="light" initial={1} autoAdvance={true} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
